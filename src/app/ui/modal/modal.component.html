@if (open()) {
  <div class="ct-modal__scrim" (click)="closed.emit()">
    <div #dialog class="ct-modal" role="dialog" aria-modal="true" [attr.aria-label]="heading()"
         (click)="$event.stopPropagation()" (keydown.tab)="onTab($event)">
      <h2 class="ct-modal__header">{{ heading() }}</h2>
      <div class="ct-modal__body"><ng-content /></div>
      <footer class="ct-modal__footer"><ng-content select="[ctModalFooter]" /></footer>
    </div>
  </div>
}
