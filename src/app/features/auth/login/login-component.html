<form class="login" [formGroup]="loginForm" (ngSubmit)="login()">
  <ct-card heading="On Standby">
    <div class="login__fields">
      <p class="login__lede">Good to see you again!</p>
      <ct-text-field
        label="Email"
        [value]="loginForm.controls.email.value"
        (valueChange)="loginForm.controls.email.setValue($event)" />
      <ct-text-field
        label="Password"
        type="password"
        [value]="loginForm.controls.password.value"
        (valueChange)="loginForm.controls.password.setValue($event)" />
    </div>
    <div class="button-container" ctCardFooter>
      <ct-button variant="ghost" (click)="switchToRegistration()">Not cleared for takeoff?</ct-button>
      <ct-button variant="primary" type="submit" [disabled]="loginForm.invalid">Log in</ct-button>
    </div>
  </ct-card>
</form>
