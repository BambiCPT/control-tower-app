<form class="registration" [formGroup]="registrationForm" (ngSubmit)="createAccount()">
  <ct-card heading="Create an account, Cadet">
    <div class="registration__fields">
      <ct-text-field
        label="Username"
        [value]="registrationForm.controls.username.value"
        (valueChange)="registrationForm.controls.username.setValue($event)" />
      <ct-text-field
        label="Email"
        type="email"
        [value]="registrationForm.controls.email.value"
        (valueChange)="registrationForm.controls.email.setValue($event)" />
      <ct-text-field
        label="Password"
        type="password"
        [value]="registrationForm.controls.password.value"
        (valueChange)="registrationForm.controls.password.setValue($event)" />
    </div>
    <ng-container ctCardFooter>
      <ct-button variant="ghost" (click)="switchToLogin()">Already have an account?</ct-button>
      <ct-button variant="primary" type="submit" [disabled]="registrationForm.invalid">Create Account</ct-button>
    </ng-container>
  </ct-card>
</form>
